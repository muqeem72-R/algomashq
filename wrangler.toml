# Cloudflare Worker configuration: the static site is in public/, the API is in functions/ (routed by src/worker.js).
# Secrets (BREVO_API_KEY, TURNSTILE_SECRET, APP_SECRET) are NOT stored here: add them in
# the Cloudflare dashboard (Worker > Settings > Variables and Secrets) and, for local work, in .dev.vars.

name = "algomashq"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The free address https://algomashq.<your-subdomain>.workers.dev. No extra preview addresses.
workers_dev = true
preview_urls = false

# Files in public/ are served directly. Only /api/* runs the Worker code.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Replace database_id with the id of the D1 database named algomashq (dashboard > Storage & databases > D1,
# or: npx wrangler d1 create algomashq).
[[d1_databases]]
binding = "DB"
database_name = "algomashq"
database_id = "c1fa11d5-8968-424d-a6c1-d8856e047636"

[vars]
APP_NAME = "AlgoMashq"
# Public Turnstile site key (Cloudflare dashboard > Turnstile). It is public by design; the secret key is not stored here.
TURNSTILE_SITE_KEY = "0x4AAAAAAFyUOqDaBEATu8SS"
# Sender shown on login emails. It must be a sender or domain verified in Brevo.
BREVO_SENDER_EMAIL = "mukeemuddeen9694@gmail.com"
BREVO_SENDER_NAME = "AlgoMashq"
# Sign in with Google. This is the OAuth "client id" of a Web application (Google Cloud console > APIs & Services >
# Credentials). It is public by design, not a secret. The Google button is hidden while it is empty.
GOOGLE_CLIENT_ID = ""
# Admins are NOT listed here (this file is committed to GitHub): set the secret ADMIN_EMAILS (comma separated emails) with
#   npx wrangler secret put ADMIN_EMAILS
# Nobody is an admin while it is not set.
# Where the Java sandbox lives (a second Worker, see java/). Java is switched off when this is empty.
JAVA_ORIGIN = "https://algomashq-java.mukeemkhan.workers.dev"
